 y="409.78" fill="#000" font-size="14" textLength="83.262" font-family="Helvetica">Closed within</text><text x="12" y="423.78" fill="#000" font-size="14" textLength="48.234" font-family="Helvetica">the limit</text><rect x="166.45" y="637" width="82.365" height="40" fill="#FFE066" style="stroke:#333;stroke-width:0.5;" rx="6" ry="6"/><text x="171.45" y="653.78" fill="#000" font-size="14" textLength="72.365" font-family="Helvetica">Closed with</text><text x="171.45" y="667.78" fill="#000" font-size="14" textLength="51.365" font-family="Helvetica">violation</text><g class="start_entity" data-qualified-name=".start." id="ent0007" data-source-line="253"><ellipse cx="261.63" cy="51" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0018" data-source-line="263"><ellipse cx="91.63" cy="745" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="91.63" cy="745" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN21" id="ent0022" data-source-line="267"><path d="M312.95,510 L312.95,524.5 L252.66,528.5 L312.95,532.5 L312.95,547 A6,6 0 0 0 318.95,553 L548.303,553 A6,6 0 0 0 554.303,547 L554.303,514 L544.303,504 L318.95,504 A6,6 0 0 0 312.95,510" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M544.303,504 L544.303,511 A3,3 0 0 0 547.303,514 L554.303,514 L544.303,504" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="318.95" y="519.01" fill="#000" font-size="13" textLength="204.496" font-family="Helvetica">Even here the layer remains useful:</text><text x="318.95" y="532.01" fill="#000" font-size="13" textLength="200.878" font-family="Helvetica">it prioritizes actions that reduce the</text><text x="318.95" y="545.01" fill="#000" font-size="13" textLength="220.353" font-family="Helvetica">DIC and FIC compensation (CON-02).</text></g><!--link *start* to Dentro--><g class="link" data-entity-1="ent